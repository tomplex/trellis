[package]
name = "trellis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trellis"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
md-5 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
